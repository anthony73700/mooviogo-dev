<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mooviogo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0818"/>
      <stop offset="60%" stop-color="#1a1231"/>
      <stop offset="100%" stop-color="#2b0f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6A4D"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="220" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="180" cy="520" r="240" fill="#ffffff" fill-opacity="0.03"/>

  <g transform="translate(120 170)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="url(#accent)"/>
    <text x="46" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">M</text>
    <text x="124" y="62" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Mooviogo</text>
    <text x="0" y="146" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f8fafc" fill-opacity="0.92">
      Sorties, activites et nightlife en reservation instantanee.
    </text>
    <text x="0" y="196" font-family="Inter, Arial, sans-serif" font-size="24" fill="#f8fafc" fill-opacity="0.58">
      Decouvre quoi faire ce soir, reserve et partage avec ton crew.
    </text>
  </g>
</svg>
