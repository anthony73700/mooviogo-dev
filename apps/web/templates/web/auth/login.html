{% extends "base.html" %}
{% block title %}Connexion | Mooviogo{% endblock %}

{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:4rem 1rem;background:radial-gradient(ellipse at 50% -20%,rgba(255,106,77,0.07) 0%,transparent 60%)">
  <div style="width:100%;max-width:380px">

    <div style="text-align:center;margin-bottom:2.25rem">
      <a href="/" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;margin-bottom:1.25rem">
        <span style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#FF6A4D,#F97316);display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#fff;font-weight:900">M</span>
        <span style="font-size:1.15rem;font-weight:900;color:#fff;letter-spacing:-0.02em">Mooviogo</span>
      </a>
      <p style="font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-0.025em;margin-bottom:0.35rem">Bon retour !</p>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.38)">Connecte-toi à ton compte Mooviogo</p>
    </div>

    <div class="pk" style="padding:2rem">
      {% if error %}
      <div style="margin-bottom:1.25rem;border-radius:12px;border:1px solid rgba(248,113,113,0.2);background:rgba(248,113,113,0.08);padding:0.85rem 1rem;font-size:0.82rem;color:#F87171">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div style="display:flex;flex-direction:column;gap:1rem">
          <div>
            <label style="display:block;font-size:0.75rem;font-weight:600;color:rgba(255,255,255,0.4);margin-bottom:0.45rem">Email ou nom d'utilisateur</label>
            <input type="text" name="username" autofocus required class="fi-input" placeholder="toi@example.com" />
          </div>
          <div>
            <label style="display:block;font-size:0.75rem;font-weight:600;color:rgba(255,255,255,0.4);margin-bottom:0.45rem">Mot de passe</label>
            <input type="password" name="password" required class="fi-input" placeholder="••••••••" />
          </div>
        </div>
        <button type="submit" class="btn-brand" style="margin-top:1.5rem;width:100%;padding:0.9rem;font-size:0.92rem;border-radius:14px;justify-content:center;font-weight:800">
          Se connecter
        </button>
      </form>

      <div class="hdiv"></div>

      <p style="text-align:center;font-size:0.82rem;color:rgba(255,255,255,0.35)">
        Pas encore de compte ?
        <a href="/inscription/" style="color:#FF8A66;text-decoration:none;font-weight:600">S'inscrire</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
