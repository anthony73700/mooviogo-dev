{% extends "base.html" %}
{% block title %}Inscription | Mooviogo{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <a href="/" class="text-2xl font-bold text-white"><span class="text-brand">●</span> Mooviogo</a>
      <p class="mt-3 text-white/50">Crée ton compte en 30 secondes</p>
    </div>

    <div class="card p-8">
      {% if error %}
      <div class="mb-5 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="mb-2 block text-sm text-white/60">Nom d'utilisateur *</label>
            <input type="text" name="username" required autofocus class="input" placeholder="ton_pseudo" />
          </div>
          <div>
            <label class="mb-2 block text-sm text-white/60">Email *</label>
            <input type="email" name="email" required class="input" placeholder="toi@example.com" />
          </div>
          <div>
            <label class="mb-2 block text-sm text-white/60">Mot de passe *</label>
            <input type="password" name="password" required class="input" placeholder="8 caractères minimum" />
          </div>
          <div>
            <label class="mb-2 block text-sm text-white/60">Confirmer le mot de passe *</label>
            <input type="password" name="password2" required class="input" placeholder="••••••••" />
          </div>
        </div>
        <button type="submit" class="btn-brand mt-6 w-full py-3 text-base">Créer mon compte</button>
      </form>

      <p class="mt-6 text-center text-sm text-white/40">
        Déjà un compte ?
        <a href="/connexion/" class="text-brand hover:underline">Se connecter</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
