{% extends "base.html" %}
{% block title %}Modifier mon profil | Mooviogo{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl px-4 py-12">
  <a href="/profil/" class="inline-flex items-center text-sm text-white/60 hover:text-white mb-4">← Mon profil</a>
  <h1 class="font-display text-3xl font-extrabold text-white">Modifier mon profil</h1>
  <p class="mt-2 text-sm text-white/55">Personnalise ton profil public.</p>

  <form method="post" enctype="multipart/form-data" class="mt-8 panel p-7 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-white/55 mb-1.5 uppercase tracking-wider">Nom affiché</label>
      <input type="text" name="display_name" value="{{ user.display_name|default:'' }}" class="input" placeholder="Ton prénom ou pseudo" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-white/55 mb-1.5 uppercase tracking-wider">Bio</label>
      <textarea name="bio" rows="4" class="input" placeholder="Quelques mots sur toi…">{{ user.bio|default:'' }}</textarea>
    </div>
    <div>
      <label class="block text-xs font-semibold text-white/55 mb-1.5 uppercase tracking-wider">Ville</label>
      <input type="text" name="city" value="{{ user.city|default:'' }}" class="input" placeholder="Paris" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-white/55 mb-1.5 uppercase tracking-wider">URL de l'avatar</label>
      <input type="url" name="avatar_url" value="{{ user.avatar_url|default:'' }}" class="input" placeholder="https://…" />
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary flex-1">Enregistrer</button>
      <a href="/profil/" class="btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
