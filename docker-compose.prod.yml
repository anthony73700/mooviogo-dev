# Production-grade compose stack for Mooviogo.
# Usage:
#   cp .env.production.example .env.production && nano .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Recommended: use external managed Postgres + Redis; comment out the `db` and
# `redis` services below and point DATABASE_URL / REDIS_URL to the managed URLs.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mooviogo:latest
    command: ["web"]
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: mooviogo.settings.production
    depends_on:
      - db
      - redis
    volumes:
      - mooviogo_media:/app/media
      - mooviogo_static:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  asgi:
    image: mooviogo:latest
    command: ["asgi"]
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: mooviogo.settings.production
      PORT: "8001"
    depends_on:
      - db
      - redis
      - web
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  worker:
    image: mooviogo:latest
    command: ["worker"]
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: mooviogo.settings.production
    depends_on:
      - db
      - redis
    restart: unless-stopped

  beat:
    image: mooviogo:latest
    command: ["beat"]
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: mooviogo.settings.production
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ─── Optional local services (replace with managed in real prod) ─────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mooviogo}
      POSTGRES_USER: ${POSTGRES_USER:-mooviogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - mooviogo_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mooviogo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mooviogo_redis:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - asgi
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mooviogo_static:/app/staticfiles:ro
      - mooviogo_media:/app/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  mooviogo_pg:
  mooviogo_redis:
  mooviogo_static:
  mooviogo_media:
